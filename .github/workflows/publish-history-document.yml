name: 自动发布历史文档

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read
  issues: write

concurrency:
  group: publish-history-document-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish:
    name: 发布到 Not-have/learn
    if: startsWith(github.event.issue.title, '[文档发布]')
    runs-on: ubuntu-latest
    steps:
      - name: 检出可信发布脚本
        uses: actions/checkout@v6

      - name: 判断是否允许直接发布
        id: author
        run: node scripts/document-publishing/classify-author.mjs

      - name: 为目标仓库生成 GitHub App 短期令牌
        if: steps.author.outputs.allowed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOC_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.DOC_PUBLISHER_PRIVATE_KEY }}
          owner: Not-have
          repositories: learn

      - name: 处理并发布历史文档
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/document-publishing/publish-history-document.mjs
